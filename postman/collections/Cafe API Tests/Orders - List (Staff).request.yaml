$kind: http-request
name: Orders / List (Staff)
url: "{{baseUrl}}/api/orders"
method: GET
scripts:
  - type: afterResponse
    code: >-
      pm.test("Orders endpoint responds", () =>
      pm.response.to.have.status(200));

      pm.test("Payload includes ok flag", () =>
      pm.expect(pm.response.json().ok).to.be.true);
    language: text/javascript
order: 3000
